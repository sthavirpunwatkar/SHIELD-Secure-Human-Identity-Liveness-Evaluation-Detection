name: SHIELD CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    name: Backend Test (Python)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y libgl1
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest httpx onnx onnxscript pytest-asyncio
        
    - name: Download Model Weights
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p models
        gh release download v2.0.0 -D models/ -p "*"

    - name: Run Pytest
      run: |
        pytest tests/
        
    - name: Verify Backend Startup
      run: |
        uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        curl -f http://127.0.0.1:8000/health
        kill %1

  frontend-test:
    name: Frontend Test (Flutter)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Install dependencies
      run: |
        cd frontend
        flutter pub get
        
    - name: Analyze project source
      run: |
        cd frontend
        flutter analyze --no-fatal-infos --no-fatal-warnings
        dart analyze
        
    - name: Run Flutter Tests
      run: |
        cd frontend
        flutter test
        
    - name: Build Frontend
      run: |
        cd frontend
        flutter build web

  docker-build:
    name: Build Backend Docker Image
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ghcr.io/sthavirpunwatkar/shield-secure-human-identity-liveness-evaluation-detection/shield-backend:latest

  release:
    name: Release Workflow
    needs: [docker-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Build Release Artifacts
        run: |
          mkdir -p artifacts
          cp RELEASE_NOTES_v2_RC1.md artifacts/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true
